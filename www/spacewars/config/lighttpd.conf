server.document-root = "/data/data/com.termux/files/home/LinxOS/www/spacewars"
server.port = 8080

server.modules = (
  "mod_access",
  "mod_fastcgi"
)

mimetype.assign = (
  ".html" => "text/html",
  ".css"  => "text/css",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".png"  => "image/png"
)

fastcgi.server = ( ".php" =>
  ((
    "bin-path" => "php-cgi",
    "socket" => "/data/data/com.termux/files/home/LinxOS/www/spacewars/php.socket"
  ))
)

index-file.names = ( "index.php", "index.html" )
server.errorlog = "/data/data/com.termux/files/home/LinxOS/www/spacewars/config/error.log"
